identity:
  name: producer_generate_audios
  author: acedatacloud
  label:
    en_US: Producer Generate Audios
    zh_Hans: Producer 生成歌曲
description:
  human:
    en_US: Generate audios with Ace Data Cloud Producer Audios API.
    zh_Hans: 通过 Ace Data Cloud Producer Audios API 生成歌曲。
  llm: Generate audios with Ace Data Cloud Producer Audios API. For asynchronous results,
    preserve task_id and use the task retrieval tool until completion. A successful
    submission is not completed output.
parameters:
- name: lyric
  type: string
  required: false
  form: llm
  label:
    en_US: Lyric
    zh_Hans: 歌词
  human_description:
    en_US: Used when custom is true.
    zh_Hans: 用于生成音频的歌词内容。
  llm_description: Used when custom is true.
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于生成音乐的模型，默认为 `FUZZ-2.0`。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: FUZZ-2.0
  options:
  - value: FUZZ-2.0 Pro
    label:
      en_US: FUZZ-2.0 Pro
      zh_Hans: FUZZ-2.0 Pro
  - value: FUZZ-2.0
    label:
      en_US: FUZZ-2.0
      zh_Hans: FUZZ-2.0
  - value: FUZZ-2.0 Raw
    label:
      en_US: FUZZ-2.0 Raw
      zh_Hans: FUZZ-2.0 Raw
  - value: FUZZ-1.1 Pro
    label:
      en_US: FUZZ-1.1 Pro
      zh_Hans: FUZZ-1.1 Pro
  - value: FUZZ-1.0 Pro
    label:
      en_US: FUZZ-1.0 Pro
      zh_Hans: FUZZ-1.0 Pro
  - value: FUZZ-1.0
    label:
      en_US: FUZZ-1.0
      zh_Hans: FUZZ-1.0
  - value: FUZZ-1.1
    label:
      en_US: FUZZ-1.1
      zh_Hans: FUZZ-1.1
  - value: FUZZ-0.8
    label:
      en_US: FUZZ-0.8
      zh_Hans: FUZZ-0.8
- name: title
  type: string
  required: false
  form: form
  label:
    en_US: Title
    zh_Hans: 标题
  human_description:
    en_US: Set title.
    zh_Hans: 生成歌曲时使用的标题。
  llm_description: Set title.
- name: action
  type: select
  required: false
  form: form
  label:
    en_US: Action
    zh_Hans: 行为
  human_description:
    en_US: Generation action, e.g. generate/cover/extend/upload_cover/upload_extend/replace_section/swap_vocals/swap_instrumentals/variation.
    zh_Hans: 生成音频的操作类型。支持的值包括 `generate`（根据提示词生成）、`cover`（翻唱）、`extend`（续写）、`variation`（变体）、`swap_vocals`（替换人声）、`swap_instrumentals`（替换伴奏）、`replace_section`（替换片段）、`stems`（分离音轨）。
  llm_description: Generation action, e.g. generate/cover/extend/upload_cover/upload_extend/replace_section/swap_vocals/swap_instrumentals/variation.
  default: generate
  options:
  - value: generate
    label:
      en_US: generate
      zh_Hans: generate
  - value: cover
    label:
      en_US: cover
      zh_Hans: cover
  - value: extend
    label:
      en_US: extend
      zh_Hans: extend
  - value: variation
    label:
      en_US: variation
      zh_Hans: variation
  - value: swap_vocals
    label:
      en_US: swap_vocals
      zh_Hans: swap_vocals
  - value: swap_instrumentals
    label:
      en_US: swap_instrumentals
      zh_Hans: swap_instrumentals
  - value: replace_section
    label:
      en_US: replace_section
      zh_Hans: replace_section
  - value: stems
    label:
      en_US: stems
      zh_Hans: stems
- name: custom
  type: boolean
  required: false
  form: form
  label:
    en_US: Custom Mode
    zh_Hans: 自定义模式
  human_description:
    en_US: If true, generate from lyric/title and other custom parameters.
    zh_Hans: 是否为自定义模式。若为 `true`，音频将根据 `lyric`（歌词）生成；否则将根据 `prompt`（提示词）生成。
  llm_description: If true, generate from lyric/title and other custom parameters.
- name: prompt
  type: string
  required: false
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Used when generating from a prompt (custom=false).
    zh_Hans: 用于生成音频的提示词，长度不得超过 200 个字符。
  llm_description: Used when generating from a prompt (custom=false).
- name: audio_id
  type: string
  required: false
  form: form
  label:
    en_US: Audio ID
    zh_Hans: 音频ID
  human_description:
    en_US: Required for cover/extend/upload_* and other edit actions.
    zh_Hans: 参考歌曲的唯一 ID。
  llm_description: Required for cover/extend/upload_* and other edit actions.
- name: continue_at
  type: number
  required: false
  form: form
  label:
    en_US: Continue At (seconds)
    zh_Hans: 续写时间(秒)
  human_description:
    en_US: Used for extend.
    zh_Hans: 指定从歌曲的哪个时间点（秒）开始续写。
  llm_description: Used for extend.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 音频生成完成后将被调用的回调 URL。
  llm_description: Set callback url for this operation.
- name: seed
  type: string
  required: false
  form: form
  label:
    en_US: Seed
    zh_Hans: 种子
  human_description:
    en_US: Set seed.
    zh_Hans: 音频生成所使用的随机种子。
  llm_description: Set seed.
- name: instrumental
  type: boolean
  required: false
  form: form
  label:
    en_US: Instrumental
    zh_Hans: 纯音乐
  human_description:
    en_US: Generate instrumental-only audios.
    zh_Hans: 若为 `true`，生成的音频将仅包含伴奏，不含人声歌词。
  llm_description: Generate instrumental-only audios.
- name: sound_strength
  type: number
  required: false
  form: form
  label:
    en_US: Sound Strength
    zh_Hans: 音频提示词强度
  human_description:
    en_US: 0.2-1, default 0.7.
    zh_Hans: 音频提示词的影响强度，可在 0.2 到 1 之间选择，默认值为 0.5。
  llm_description: 0.2-1, default 0.7.
- name: lyrics_strength
  type: number
  required: false
  form: form
  label:
    en_US: Lyrics Strength
    zh_Hans: 歌词强度
  human_description:
    en_US: 0-1, default 0.7.
    zh_Hans: 歌词对音频生成的影响程度，可在 0 到 1 之间选择，默认值为 0.5。
  llm_description: 0-1, default 0.7.
- name: weirdness
  type: number
  required: false
  form: form
  label:
    en_US: Weirdness
    zh_Hans: 风格奇特度
  human_description:
    en_US: 0-1, default 0.5.
    zh_Hans: 风格独特性程度，可在 0 到 1 之间选择，默认值为 0.5。
  llm_description: 0-1, default 0.5.
- name: replace_section_end
  type: number
  required: false
  form: form
  label:
    en_US: Replace End (seconds)
    zh_Hans: 替换结束(秒)
  human_description:
    en_US: Set replace end (seconds).
    zh_Hans: 替换片段的结束时间点（秒）。
  llm_description: Set replace end (seconds).
- name: replace_section_start
  type: number
  required: false
  form: form
  label:
    en_US: Replace Start (seconds)
    zh_Hans: 替换开始(秒)
  human_description:
    en_US: Set replace start (seconds).
    zh_Hans: 替换片段的起始时间点（秒）。
  llm_description: Set replace start (seconds).
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/producer_generate_audios.py
