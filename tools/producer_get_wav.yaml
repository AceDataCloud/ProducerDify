identity:
  name: producer_get_wav
  author: acedatacloud
  label:
    en_US: Producer Get WAV
    zh_Hans: Producer 获取 WAV
description:
  human:
    en_US: Get the generated song WAV download URLs by audio_id.
    zh_Hans: 通过 audio_id 获取歌曲 WAV 下载链接。
  llm: Retrieve WAV file_url list for a given audio_id via Ace Data Cloud Producer
    WAV API. Generation returns a task ID. Query the same task until complete; never
    resubmit a pending generation.
parameters:
- name: audio_id
  type: string
  required: true
  label:
    en_US: Audio ID
    zh_Hans: 音频ID
  human_description:
    en_US: Producer audio id.
    zh_Hans: Producer 生成的歌曲 ID。
  llm_description: Producer audio id.
  form: form
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/producer_get_wav.py
